set -g prefix C-b
bind C-b send-prefix

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Start windows/panes at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Mouse support
set -g mouse on

# Vi mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind c new-window -c "#{pane_current_path}"

# Easy splits (open in current path)
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Navigate panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

# --- Styling ---
set -g status-position bottom
set -g status-style "bg=#0a0a0a,fg=#666666"

set -g status-left "#[fg=#888888] #S "
set -g status-left-length 20

set -g status-right "#[fg=#444444]%H:%M "

setw -g window-status-format "#[fg=#444444] #I:#W "
setw -g window-status-current-format "#[fg=#c0c0c0,bold] #I:#W "

set -g pane-border-style "fg=#1a1a1a"
set -g pane-active-border-style "fg=#333333"

set -g message-style "bg=#0a0a0a,fg=#888888"
